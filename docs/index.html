<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ITWUH KPI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f4f6fa;
    --surface:#ffffff;
    --surface-2:#eef1f7;
    --surface-3:#e4e9f2;
    --border:rgba(15,23,42,0.11);
    --border-strong:rgba(15,23,42,0.18);
    --text-primary:#0d1b2a;
    --text-secondary:#4c5568;
    --text-muted:#8991a3;
    --accent:#2a78d6;
    --accent-strong:#184f95;
    --accent-soft:#e4eefb;
    --on-accent:#ffffff;
    --good:#0ca30c;
    --warning:#c07600;
    --serious:#c1521f;
    --critical:#c22f2f;
    --good-soft:#e2f6df;
    --warning-soft:#fdf0d6;
    --serious-soft:#fbe3d6;
    --critical-soft:#fadede;
    --neutral-soft:#eceef2;
    --cat-1:#2a78d6;
    --cat-2:#c85a2c;
    --cat-3:#178c63;
    --shadow:0 1px 2px rgba(15,23,42,0.06), 0 8px 24px -12px rgba(15,23,42,0.18);
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:20px;
    --font-display:"Chakra Petch",system-ui,sans-serif;
    --font-body:"Sarabun",system-ui,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0e16;
      --surface:#121826;
      --surface-2:#182032;
      --surface-3:#212b41;
      --border:rgba(255,255,255,0.10);
      --border-strong:rgba(255,255,255,0.18);
      --text-primary:#f2f4f9;
      --text-secondary:#b7bfd1;
      --text-muted:#7d859c;
      --accent:#5b9ce8;
      --accent-strong:#8dbdf2;
      --accent-soft:rgba(91,156,232,0.16);
      --on-accent:#08111e;
      --good:#3ecf3e;
      --warning:#f0ac2e;
      --serious:#f08a5c;
      --critical:#f16565;
      --good-soft:rgba(62,207,62,0.14);
      --warning-soft:rgba(240,172,46,0.14);
      --serious-soft:rgba(240,138,92,0.14);
      --critical-soft:rgba(241,101,101,0.14);
      --neutral-soft:#1c2436;
      --cat-1:#5b9ce8;
      --cat-2:#e8895a;
      --cat-3:#3fb98c;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0e16;
    --surface:#121826;
    --surface-2:#182032;
    --surface-3:#212b41;
    --border:rgba(255,255,255,0.10);
    --border-strong:rgba(255,255,255,0.18);
    --text-primary:#f2f4f9;
    --text-secondary:#b7bfd1;
    --text-muted:#7d859c;
    --accent:#5b9ce8;
    --accent-strong:#8dbdf2;
    --accent-soft:rgba(91,156,232,0.16);
    --on-accent:#08111e;
    --good:#3ecf3e;
    --warning:#f0ac2e;
    --serious:#f08a5c;
    --critical:#f16565;
    --good-soft:rgba(62,207,62,0.14);
    --warning-soft:rgba(240,172,46,0.14);
    --serious-soft:rgba(240,138,92,0.14);
    --critical-soft:rgba(241,101,101,0.14);
    --neutral-soft:#1c2436;
    --cat-1:#5b9ce8;
    --cat-2:#e8895a;
    --cat-3:#3fb98c;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  body{
    background:var(--bg);
    color:var(--text-primary);
    font-family:var(--font-body);
    margin:0;
    padding-inline:0;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0;}
  p{margin:0;}
  button{font-family:var(--font-body);}
  input,select,textarea{font-family:var(--font-body);}
  .tabular{font-variant-numeric:tabular-nums;}

  a{color:var(--accent);}

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding-inline:20px;
  }

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:40;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    display:flex;
    align-items:center;
    gap:16px;
    padding-block:14px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    flex:1 1 320px;
    min-width:0;
  }
  .brand-mark{
    width:42px;height:42px;border-radius:11px;flex:none;
    background:linear-gradient(155deg,var(--accent),var(--accent-strong));
    display:flex;align-items:center;justify-content:center;
    color:var(--on-accent);
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
  }
  .brand-text{min-width:0;}
  .brand-text .dept{
    font-family:var(--font-display);
    font-weight:600;
    font-size:15px;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand-text .org{
    font-size:12.5px;
    color:var(--text-secondary);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .period-pill{
    font-size:12.5px;
    font-weight:600;
    color:var(--accent-strong);
    background:var(--accent-soft);
    border-radius:999px;
    padding:5px 12px;
    white-space:nowrap;
    flex:none;
  }
  .sync-pill{
    display:flex; align-items:center; gap:6px; flex:none;
    font-size:12px; font-weight:600; padding:5px 11px; border-radius:999px;
    background:var(--neutral-soft); color:var(--text-muted); white-space:nowrap;
  }
  .sync-pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }
  .sync-pill.ok{ background:var(--good-soft); color:var(--good); }
  .sync-pill.busy{ background:var(--warning-soft); color:var(--warning); }
  .sync-pill.err{ background:var(--critical-soft); color:var(--critical); }
  .sync-pill button{ border:none; background:none; color:inherit; font:inherit; text-decoration:underline; cursor:pointer; padding:0; }
  .year-control{
    display:flex; align-items:center; gap:6px; flex:none;
  }
  .year-control .field-select{ font-weight:600; padding:7px 9px; }
  .add-year-btn{
    width:32px; height:32px; flex:none;
    border-radius:9px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-secondary);
    font-size:17px; font-weight:700; line-height:1; cursor:pointer;
  }
  .add-year-btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .inline-add-row{
    display:flex; align-items:center; gap:6px; flex:none;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-s);
    padding:5px; margin-left:-4px;
  }
  .inline-add-row input{ width:110px; }
  .btn-mini{
    border:none; border-radius:6px; padding:7px 11px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .btn-mini.confirm{ background:var(--accent); color:var(--on-accent); }
  .btn-mini.confirm:hover{ background:var(--accent-strong); }
  .btn-mini.cancel{ background:transparent; color:var(--text-secondary); }
  .btn-mini.cancel:hover{ color:var(--critical); }
  .inline-error{ font-size:11.5px; color:var(--critical); flex-basis:100%; }
  .whoami{
    display:flex;
    align-items:center;
    gap:8px;
    flex:none;
    margin-left:auto;
  }
  .whoami label{font-size:12.5px; color:var(--text-secondary); white-space:nowrap;}
  .field-select, .field-input, .field-textarea{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-primary);
    border-radius:var(--radius-s);
    padding:8px 10px;
    font-size:13.5px;
    outline:none;
  }
  .field-select:focus, .field-input:focus, .field-textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }

  /* ---------- section tabs ---------- */
  .section-tabs{
    display:flex;
    gap:8px;
    padding-block:14px 2px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .section-tabs::-webkit-scrollbar{ display:none; }
  .section-tabs button{
    flex:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-secondary);
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .section-tabs button:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .section-tabs button.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

  /* ---------- dashboard ---------- */
  .dashboard{
    padding-block:22px 8px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
  }
  @media (max-width:860px){ .dashboard{grid-template-columns:repeat(2,1fr);} }
  .stat-tile{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:16px 16px 14px;
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:6px;
  }
  .stat-tile .label{font-size:12.5px; color:var(--text-secondary); font-weight:600;}
  .stat-tile .value{font-family:var(--font-display); font-size:28px; font-weight:700; line-height:1;}
  .stat-tile .sub{font-size:12px; color:var(--text-muted);}
  .stat-tile.accent .value{color:var(--accent-strong);}
  .stat-tile.good .value{color:var(--good);}
  .stat-tile.critical .value{color:var(--critical);}

  .charts-row{
    display:grid;
    grid-template-columns:1.05fr 1fr;
    gap:12px;
    padding-block:12px 4px;
  }
  @media (max-width:860px){ .charts-row{grid-template-columns:1fr;} }
  .chart-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:16px 18px 18px;
    box-shadow:var(--shadow);
  }
  .chart-card h3{font-size:14.5px; font-weight:600; margin-bottom:12px;}
  .donut-row{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .legend{display:flex; flex-direction:column; gap:8px; flex:1 1 160px; min-width:150px;}
  .legend-item{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-secondary);}
  .legend-item .dot{width:10px;height:10px;border-radius:3px;flex:none;}
  .legend-item .n{margin-left:auto; font-weight:600; color:var(--text-primary);}
  .bar-list{display:flex; flex-direction:column; gap:12px;}
  .bar-row .bar-head{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; color:var(--text-secondary);}
  .bar-row .bar-head b{color:var(--text-primary); font-weight:600;}
  .bar-track{height:9px; border-radius:5px; background:var(--surface-3); overflow:hidden;}
  .bar-fill{height:100%; border-radius:5px;}
  .tooltip{
    position:fixed; pointer-events:none; z-index:80;
    background:var(--text-primary); color:var(--bg);
    font-size:12px; padding:6px 9px; border-radius:7px;
    box-shadow:var(--shadow); opacity:0; transform:translate(-50%,-120%);
    transition:opacity .1s ease; white-space:nowrap;
  }
  .tooltip.show{opacity:1;}

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky;
    top:calc(env(safe-area-inset-top,0px) + var(--topbar-h,66px));
    z-index:30;
    background:var(--bg);
    padding-block:12px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    border-bottom:1px solid var(--border);
  }
  .search-box{
    position:relative;
    flex:1 1 220px;
    min-width:180px;
  }
  .search-box input{
    width:100%;
    padding-left:34px;
  }
  .search-box svg{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    color:var(--text-muted);
  }
  .seg{
    display:flex;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px;
    gap:2px;
    flex:none;
  }
  .seg button{
    border:none; background:transparent; color:var(--text-secondary);
    font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px;
    cursor:pointer;
  }
  .seg button.active{ background:var(--accent); color:var(--on-accent); }

  /* ---------- list ---------- */
  .group-block{padding-top:22px;}
  .group-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:12px;
    padding-bottom:8px; border-bottom:1px solid var(--border);
  }
  .group-head h2{font-size:17px;}
  .group-head .count{font-size:13px; color:var(--text-muted);}
  .add-kpi-btn{
    margin-left:auto; flex:none;
    border:1px dashed var(--border-strong); background:var(--surface); color:var(--accent-strong);
    font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .add-kpi-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:12px;
    padding-bottom:6px;
  }
  .kpi-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:14px 15px 13px;
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:9px;
    cursor:pointer;
    text-align:left;
    color:inherit;
    transition:border-color .12s ease, transform .12s ease;
  }
  .kpi-card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .kpi-card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .card-top{display:flex; align-items:center; gap:8px;}
  .no-badge{
    font-family:var(--font-display); font-weight:700; font-size:12.5px;
    background:var(--surface-2); color:var(--text-secondary);
    border-radius:6px; padding:3px 7px; flex:none;
  }
  .cat-tag{
    font-size:11.5px; font-weight:600; color:var(--text-muted);
    background:var(--surface-2); border-radius:999px; padding:3px 9px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .status-pill{
    margin-left:auto; flex:none;
    display:flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px;
  }
  .status-pill .dot{width:7px;height:7px;border-radius:50%;}
  .status-pill.st-not_started{ background:var(--neutral-soft); color:var(--text-muted); }
  .status-pill.st-not_started .dot{ background:var(--text-muted); }
  .status-pill.st-in_progress{ background:var(--warning-soft); color:var(--warning); }
  .status-pill.st-in_progress .dot{ background:var(--warning); }
  .status-pill.st-done{ background:var(--good-soft); color:var(--good); }
  .status-pill.st-done .dot{ background:var(--good); }
  .status-pill.st-delayed{ background:var(--critical-soft); color:var(--critical); }
  .status-pill.st-delayed .dot{ background:var(--critical); }

  .card-title{font-size:14.5px; font-weight:600; line-height:1.4;}
  .card-kpi{
    font-size:12.5px; color:var(--text-secondary); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-foot{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-top:auto; padding-top:8px; border-top:1px dashed var(--border);
  }
  .owner-chip{
    font-size:11.5px; color:var(--text-secondary);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%;
  }
  .target-chip{
    font-size:11.5px; font-weight:700; color:var(--accent-strong);
    background:var(--accent-soft); border-radius:6px; padding:3px 8px; flex:none;
  }
  .target-chip.good{ color:var(--good); background:var(--good-soft); }
  .target-chip.critical{ color:var(--critical); background:var(--critical-soft); }
  .actual-line{
    font-size:12px; color:var(--text-secondary);
    display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;
  }
  .actual-line.muted{ color:var(--text-muted); font-style:italic; }
  .actual-val{ font-weight:700; color:var(--accent-strong); }
  .actual-val.good{ color:var(--good); }
  .actual-val.warning{ color:var(--warning); }
  .actual-asof{ font-size:10.5px; color:var(--text-muted); }
  .progress-line{display:flex; align-items:center; gap:7px;}
  .progress-track{flex:1; height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden;}
  .progress-fill{height:100%; border-radius:3px; background:var(--accent);}
  .progress-text{font-size:11px; color:var(--text-muted); flex:none;}

  .empty-note{
    padding:40px 10px; text-align:center; color:var(--text-muted); font-size:13.5px;
  }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,12,20,0.5);
    display:flex; align-items:flex-start; justify-content:center;
    padding:min(6vh,48px) 16px 24px;
    overflow-y:auto;
    z-index:100;
  }
  .modal-overlay[hidden]{display:none;}
  .modal{
    background:var(--surface);
    border-radius:var(--radius-l);
    max-width:640px; width:100%;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
  }
  .modal-head{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--border);
    display:flex; gap:12px; align-items:flex-start;
  }
  .modal-head .no-badge{margin-top:2px;}
  .modal-head-text{flex:1; min-width:0;}
  .modal-head-text h3{font-size:16.5px; line-height:1.4;}
  .modal-head-text .meta{font-size:12.5px; color:var(--text-secondary); margin-top:4px;}
  .close-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-secondary); flex:none;
  }
  .close-btn:hover{ color:var(--critical); }
  .edit-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    height:32px; padding:0 12px; display:flex; align-items:center; gap:6px;
    cursor:pointer; color:var(--text-secondary); flex:none; font-size:12.5px; font-weight:700;
  }
  .edit-btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .head-actions{ display:flex; gap:8px; flex:none; }
  .modal-body{padding:16px 20px 20px; display:flex; flex-direction:column; gap:16px;}
  .kpi-detail{ font-size:13px; color:var(--text-secondary); line-height:1.6; background:var(--surface-2); border-radius:var(--radius-s); padding:10px 12px; }
  .kpi-detail b{color:var(--text-primary);}

  .quarter-tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .quarter-tabs button{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-secondary);
    font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .quarter-tabs button.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .month-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .month-chip{
    border:1px solid var(--border); background:var(--surface); color:var(--text-secondary);
    font-size:12px; font-weight:600; padding:6px 4px; border-radius:9px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px; width:58px;
  }
  .month-chip .dot{width:7px;height:7px;border-radius:50%; background:var(--text-muted);}
  .month-chip.active{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); color:var(--text-primary); }

  .entry-form{ display:flex; flex-direction:column; gap:10px; background:var(--surface-2); border-radius:var(--radius-m); padding:14px; }
  .form-row{display:flex; flex-direction:column; gap:5px;}
  .form-row label{font-size:12.5px; font-weight:600; color:var(--text-secondary);}

  ];

  var kpiOverrides = {};   // id -> full kpi object, or {id, deleted:true} เพื่อซ่อนออกจากรายการ
  var KPI_CATALOG = KPI_DEFAULTS.slice();

  function rebuildCatalog(){
    var map = {};
    KPI_DEFAULTS.forEach(function(k){ map[k.id] = k; });
    Object.keys(kpiOverrides).forEach(function(id){
      var ov = kpiOverrides[id];
      if (!ov) return;
      if (ov.deleted) delete map[id];
      else map[id] = ov;
    });
    var list = [];
    var used = {};
    KPI_DEFAULTS.forEach(function(k){ if (map[k.id]){ list.push(map[k.id]); used[k.id] = true; } });
    Object.keys(map).forEach(function(id){ if (!used[id]) list.push(map[id]); });
    KPI_CATALOG = list;
  }

  // รายการ KPI ตามแท็บที่เลือกอยู่ (ใช้เป็นฐานของสถิติ/กราฟ/รายการทั้งหน้า)
  function currentCatalog(){
    if (activeGroupTab === "all") return KPI_CATALOG;
    return KPI_CATALOG.filter(function(k){ return k.group === activeGroupTab; });
  }

  function nextNoForGroup(group){
    var maxNo = 0;
    KPI_CATALOG.forEach(function(k){
      if (k.group !== group) return;
      var n = parseInt(k.no, 10);
      if (!isNaN(n) && n > maxNo) maxNo = n;
    });
    return maxNo + 1;
  }

  // ปีงบประมาณไทย (BE) เริ่ม 1 ต.ค. ของปี (BE-544-1) ค.ศ. ถึง 30 ก.ย. ของปี (BE-543) ค.ศ.
  // เช่น ปีงบประมาณ 2569 = 1 ต.ค. 2568(ค.ศ.2025) - 30 ก.ย. 2569(ค.ศ.2026)
  var DEFAULT_FISCAL_YEAR = 2569;
  function d2(n){ var v = ((n % 100) + 100) % 100; return v < 10 ? "0"+v : String(v); }
  function monthsForFiscalYear(beYear){
    var ceEnd = beYear - 543;      // ค.ศ. ของช่วง ม.ค.-ก.ย.
    var ceStart = ceEnd - 1;       // ค.ศ. ของช่วง ต.ค.-ธ.ค.
    var beOctDec = beYear - 1;     // พ.ศ. กำกับเดือน ต.ค.-ธ.ค.
    return [
      {key:ceStart+"-10",label:"ต.ค. "+d2(beOctDec),q:1},
      {key:ceStart+"-11",label:"พ.ย. "+d2(beOctDec),q:1},
      {key:ceStart+"-12",label:"ธ.ค. "+d2(beOctDec),q:1},
      {key:ceEnd+"-01",label:"ม.ค. "+d2(beYear),q:2},
      {key:ceEnd+"-02",label:"ก.พ. "+d2(beYear),q:2},
      {key:ceEnd+"-03",label:"มี.ค. "+d2(beYear),q:2},
      {key:ceEnd+"-04",label:"เม.ย. "+d2(beYear),q:3},
      {key:ceEnd+"-05",label:"พ.ค. "+d2(beYear),q:3},
      {key:ceEnd+"-06",label:"มิ.ย. "+d2(beYear),q:3},
      {key:ceEnd+"-07",label:"ก.ค. "+d2(beYear),q:4},
      {key:ceEnd+"-08",label:"ส.ค. "+d2(beYear),q:4},
      {key:ceEnd+"-09",label:"ก.ย. "+d2(beYear),q:4}
    ];
  }
  var selectedYear = DEFAULT_FISCAL_YEAR;
  var activeYears = [DEFAULT_FISCAL_YEAR];
  var MONTHS = monthsForFiscalYear(selectedYear);
  var QUARTER_LABEL = {1:"Q1 (ต.ค.–ธ.ค.)",2:"Q2 (ม.ค.–มี.ค.)",3:"Q3 (เม.ย.–มิ.ย.)",4:"Q4 (ก.ค.–ก.ย.)"};

  var STATUS_META = {
    not_started:{label:"ยังไม่รายงาน",cls:"not_started"},
    in_progress:{label:"กำลังดำเนินการ",cls:"in_progress"},
    done:{label:"เสร็จสมบูรณ์",cls:"done"},
    delayed:{label:"ล่าช้า / ติดปัญหา",cls:"delayed"}
  };
  var STATUS_ORDER = ["not_started","in_progress","done","delayed"];

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  /* ================= STATE ================= */
  var entries = {};      // key: kpiId::monthKey -> {status,actual,detail,updatedBy,updatedAt}
  // การเชื่อมต่อ Google Sheet ผ่าน Google Apps Script (google.script.run)
  // URL เว็บแอป Apps Script ใช้เมื่อเปิดหน้านี้จากที่อื่นที่ไม่ใช่ Apps Script (เช่น GitHub Pages)
  var API_URL = "https://script.google.com/macros/s/AKfycbzenmdVdks0O_HiLDc-_bbr33N864CsZh9N2jGT6hHijI7DDMYtOfM64T-2fe5EXLbc2g/exec";
  var HAS_GAS = !!(window.google && google.script && google.script.run);
  var HAS_SHEET = HAS_GAS || !!API_URL;
  var sheetLoaded = false;
  function api(fn, arg){
    if (HAS_GAS){
      return new Promise(function(resolve, reject){
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg);
      });
    }
    // ส่งแบบ text/plain เพื่อให้เบราว์เซอร์เรียก Apps Script ข้ามโดเมนได้โดยไม่ติด CORS
    return fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({fn: fn, arg: arg === undefined ? null : arg})
    }).catch(function(err){
      // เบราว์เซอร์แจ้งแค่ "Failed to fetch" เมื่อ Google ตอบเป็นหน้าล็อกอินหรือหน้า error แทนข้อมูล
      throw new Error("เว็บแอปไม่ตอบกลับเป็นข้อมูล ตรวจใน Apps Script ว่าสร้างเวอร์ชันใหม่แล้ว และผู้มีสิทธิ์เข้าถึงเป็น \"ทุกคน\"");
    }).then(function(r){
      if (!r.ok) throw new Error("เชื่อมต่อเว็บแอปไม่ได้ (HTTP " + r.status + ")");
      return r.text();
    }).then(function(text){
      var d;
      try{ d = JSON.parse(text); }
      catch(e){ throw new Error("เว็บแอปยังไม่รองรับการเรียกจากภายนอก กรุณาอัปเดต Code.gs และสร้างเวอร์ชันใหม่"); }
      if (!d.ok) throw new Error(d.error || "ไม่ทราบสาเหตุ");
      return d.result;
    });
  }
  function errText(err){ return (err && err.message) ? err.message : String(err || "ไม่ทราบสาเหตุ"); }
  function setSync(state, text){
    var pill = document.getElementById("syncPill");
    if (!pill) return;
    pill.className = "sync-pill " + (state || "");
    document.getElementById("syncText").innerHTML = text;
  }
  var searchTerm = "";
  var ownerMode = "all";
  var activeGroupTab = "all";
  var whoAmI = "";
  var currentKpiId = null;
  var currentMonthKey = MONTHS[MONTHS.length-1].key;

  function entryKey(kpiId, monthKey){ return kpiId + "::" + monthKey; }
  function getEntry(kpiId, monthKey){ return entries[entryKey(kpiId, monthKey)] || null; }

  function latestEntryForKpi(kpiId){
    for (var i = MONTHS.length - 1; i >= 0; i--){
      var e = getEntry(kpiId, MONTHS[i].key);
      if (e && e.status) return {month: MONTHS[i], entry: e};
    }
    return null;
  }
  function reportedMonthCount(kpiId){
    var n = 0;
    for (var i=0;i<MONTHS.length;i++){ var e = getEntry(kpiId, MONTHS[i].key); if (e && e.status && e.status !== "not_started") n++; }
    return n;
  }
  // นับสะสม (cumulative): รวมค่า "จำนวน" ของ KPI ประเภท count ตั้งแต่ต้นปีงบประมาณ (MONTHS ปัจจุบัน) จนถึงเดือนที่ระบุ
  function cumulativeCount(kpiId, uptoMonthKey){
    var sum = 0;
    for (var i=0;i<MONTHS.length;i++){
      var m = MONTHS[i];
      var e = getEntry(kpiId, m.key);
      if (e && typeof e.count === "number" && !isNaN(e.count)) sum += e.count;
      if (m.key === uptoMonthKey) break;
    }
    return sum;
  }
  function cumulativeCountFull(kpiId){
    var sum = 0;
    MONTHS.forEach(function(m){
      var e = getEntry(kpiId, m.key);
      if (e && typeof e.count === "number" && !isNaN(e.count)) sum += e.count;
    });
    return sum;
  }

  /* ================= OWNER LIST / WHOAMI ================= */
  function uniqueOwners(){
    var set = {}; var list = [];
    KPI_CATALOG.forEach(function(k){
      k.owner.split(",").forEach(function(part){
        var name = part.trim();
        if (name && !set[name]){ set[name]=1; list.push(name); }
      });
    });
    return list.sort(function(a,b){ return a.localeCompare(b,"th"); });
  }
  function initWhoAmI(){
    var sel = document.getElementById("whoamiSelect");
    try{ whoAmI = localStorage.getItem("kpiWhoAmI") || ""; }catch(e){ whoAmI = ""; }
    initWhoAmIOptions();
    sel.value = whoAmI || "";
    sel.addEventListener("change", function(){
      if (sel.value === "__other"){
        document.getElementById("whoamiAddRow").hidden = false;
        document.getElementById("whoamiOtherInput").value = "";
        document.getElementById("whoamiOtherInput").focus();
      } else {
        whoAmI = sel.value;
        try{ localStorage.setItem("kpiWhoAmI", whoAmI); }catch(e){}
        renderAll();
      }
    });
    var addRow = document.getElementById("whoamiAddRow");
    var otherInput = document.getElementById("whoamiOtherInput");
    function confirmOtherName(){
      var name = otherInput.value.trim();
      if (!name){ addRow.hidden = true; sel.value = whoAmI || ""; return; }
      var opt = document.createElement("option");
      opt.value = name; opt.textContent = name;
      sel.insertBefore(opt, sel.lastElementChild);
      sel.value = name;
      whoAmI = name;
      try{ localStorage.setItem("kpiWhoAmI", whoAmI); }catch(e){}
      addRow.hidden = true;
      renderAll();
    }
    document.getElementById("confirmWhoamiBtn").addEventListener("click", confirmOtherName);
    document.getElementById("cancelWhoamiBtn").addEventListener("click", function(){
      addRow.hidden = true; sel.value = whoAmI || "";
    });
    otherInput.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); confirmOtherName(); }
      if (e.key === "Escape"){ addRow.hidden = true; sel.value = whoAmI || ""; }
    });
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function ownerMatchesMe(ownerField){
    if (!whoAmI) return false;
    return ownerField.toLowerCase().indexOf(whoAmI.toLowerCase()) !== -1;
  }

  /* ================= FISCAL YEAR ================= */
  function renderYearSelect(){
    var sel = document.getElementById("yearSelect");
    var sorted = activeYears.slice().sort(function(a,b){ return a-b; });
    sel.innerHTML = sorted.map(function(y){
      return '<option value="'+y+'"'+(y===selectedYear?" selected":"")+'>ปีงบประมาณ '+y+'</option>';
    }).join("");
    var pill = document.getElementById("periodPill");
    if (pill) pill.textContent = MONTHS[0].label + " – " + MONTHS[MONTHS.length-1].label;
  }

  function switchYear(newYear){
    selectedYear = newYear;
    MONTHS = monthsForFiscalYear(selectedYear);
    currentMonthKey = MONTHS[MONTHS.length-1].key;
    try{ localStorage.setItem("kpiSelectedYear", String(selectedYear)); }catch(e){}
    renderYearSelect();
    renderAll();
    if (currentKpiId){
      var k = KPI_CATALOG.filter(function(x){ return x.id===currentKpiId; })[0];
      if (k) renderModal(k);
    }
  }

  function saveActiveYears(){
    try{ localStorage.setItem("kpiActiveYears", JSON.stringify(activeYears)); }catch(e){}
  }

  function commitNewYear(y){
    function apply(){
      if (activeYears.indexOf(y) === -1){
        activeYears.push(y);
        activeYears.sort(function(a,b){ return a-b; });
        saveActiveYears();
      }
      switchYear(y);
    }
    if (HAS_SHEET){
      setSync("busy", "กำลังเพิ่มปีงบประมาณ "+y+"...");
      api("addFiscalYear", y).then(function(){ setSync("ok", "บันทึกลง Google Sheet แล้ว"); apply(); })
        .catch(function(err){ setSync("err", "เพิ่มปีไม่สำเร็จ: "+escapeHtml(errText(err))); });
    } else {
      apply();
    }
  }

  function initYearUI(){
    try{
      var storedYears = JSON.parse(localStorage.getItem("kpiActiveYears") || "null");
      if (Array.isArray(storedYears)){
        storedYears.forEach(function(y){ if (typeof y === "number" && activeYears.indexOf(y) === -1) activeYears.push(y); });
      }
      var storedSel = parseInt(localStorage.getItem("kpiSelectedYear"), 10);
      if (storedSel && activeYears.indexOf(storedSel) === -1) activeYears.push(storedSel);
      if (storedSel){
        selectedYear = storedSel;
        MONTHS = monthsForFiscalYear(selectedYear);
        currentMonthKey = MONTHS[MONTHS.length-1].key;
      }
    }catch(e){}
    activeYears.sort(function(a,b){ return a-b; });
    renderYearSelect();
    document.getElementById("yearSelect").addEventListener("change", function(e){
      switchYear(parseInt(e.target.value, 10));
    });
    var addRow = document.getElementById("yearAddRow");
    var input = document.getElementById("newYearInput");
    var errEl = document.getElementById("yearAddError");
    document.getElementById("addYearBtn").addEventListener("click", function(){
      errEl.hidden = true;
      input.value = String(Math.max.apply(null, activeYears) + 1);
      addRow.hidden = false;
      input.focus();
      input.select();
    });
    document.getElementById("cancelAddYearBtn").addEventListener("click", function(){ addRow.hidden = true; });
    function confirmNewYear(){
      var y = parseInt(input.value.trim(), 10);
      if (!y || y < 2500 || y > 2700){
        errEl.textContent = "กรุณาระบุปี พ.ศ. ให้ถูกต้อง เช่น 2570";
        errEl.hidden = false;
        return;
      }
      addRow.hidden = true;
      commitNewYear(y);
    }
    document.getElementById("confirmAddYearBtn").addEventListener("click", confirmNewYear);
    input.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); confirmNewYear(); }
      if (e.key === "Escape"){ addRow.hidden = true; }
    });
  }

  /* ================= DASHBOARD ================= */
  function computeStats(list){
    var withMetric = list.filter(function(k){ return k.kpi; });
    var totalCells = withMetric.length * MONTHS.length;
    var filledCells = 0;
    var statusCounts = {not_started:0,in_progress:0,done:0,delayed:0};
    list.forEach(function(k){
      var latest = latestEntryForKpi(k.id);
      var st = latest ? latest.entry.status : "not_started";
      statusCounts[st] = (statusCounts[st]||0) + 1;
      if (k.kpi){
        for (var i=0;i<MONTHS.length;i++){
          var e = getEntry(k.id, MONTHS[i].key);
          if (e && e.status && e.status !== "not_started") filledCells++;
        }
      }
    });
    var groupCounts = {dept:0, individual:0, agenda:0};
    list.forEach(function(k){ groupCounts[k.group]++; });
    return {
      total: list.length,
      totalCells: totalCells, filledCells: filledCells,
      pct: totalCells ? Math.round(filledCells/totalCells*100) : 0,
      statusCounts: statusCounts,
      groupCounts: groupCounts
    };
  }

  function renderDashboard(){
    var list = currentCatalog();
    var s = computeStats(list);
    var tiles = document.getElementById("dashboardTiles");
    var scopeSub = activeGroupTab === "all"
      ? "ภาพรวมแผนก "+s.groupCounts.dept+" · รายบุคคล "+s.groupCounts.individual+" · Agenda "+s.groupCounts.agenda
      : "แสดงเฉพาะส่วน: "+GROUP_TAB_LABEL[activeGroupTab];
    tiles.innerHTML =
      '<div class="stat-tile accent"><span class="label">KPI ทั้งหมด</span><span class="value tabular">'+s.total+'</span>' +
        '<span class="sub">'+scopeSub+'</span></div>' +
      '<div class="stat-tile"><span class="label">ความคืบหน้าการรายงาน</span><span class="value tabular">'+s.pct+'%</span>' +
        '<span class="sub">'+s.filledCells+' / '+s.totalCells+' ช่อง (KPI × เดือน)</span></div>' +
      '<div class="stat-tile good"><span class="label">เสร็จสมบูรณ์ (ล่าสุด)</span><span class="value tabular">'+s.statusCounts.done+'</span>' +
        '<span class="sub">จากสถานะเดือนล่าสุดที่รายงาน</span></div>' +
      '<div class="stat-tile critical"><span class="label">ล่าช้า / ติดปัญหา</span><span class="value tabular">'+s.statusCounts.delayed+'</span>' +
        '<span class="sub">ต้องติดตามเร่งด่วน</span></div>';

    document.getElementById("chartDonutTotal").textContent = s.total;
    renderDonut(s.statusCounts, s.total);
    renderSecondChart(list, s.groupCounts);
  }

  function renderDonut(counts, total){
    var svg = document.getElementById("donutSvg");
    var legendEl = document.getElementById("donutLegend");
    var cx=75, cy=75, r=52, sw=22;
    var colorMap = {
      not_started: cssVar("--text-muted"),
      in_progress: cssVar("--warning"),
      done: cssVar("--good"),
      delayed: cssVar("--critical")
    };
    var order = ["done","in_progress","delayed","not_started"];
    var labelMap = {done:"เสร็จสมบูรณ์",in_progress:"กำลังดำเนินการ",delayed:"ล่าช้า/ติดปัญหา",not_started:"ยังไม่รายงาน"};
    var parts = [];
    var startAngle = -90;
    var circumference = 2*Math.PI*r;
    order.forEach(function(key){
      var n = counts[key] || 0;
      if (!n) return;
      var frac = n/total;
      var dash = frac*circumference;
      parts.push({key:key, n:n, frac:frac, dash:dash, offset: -( (startAngle+90)/360*circumference ), color: colorMap[key]});
      startAngle += frac*360;
    });
    var segHtml = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+cssVar("--surface-3")+'" stroke-width="'+sw+'"></circle>';
    // build using stroke-dasharray/offset approach relative to top
    var acc = 0;
    order.forEach(function(key){
      var n = counts[key] || 0;
      if (!n) return;
      var frac = n/total;
      var dash = frac*circumference;
      var gap = circumference - dash;
      var rotation = -90 + acc*360;
      segHtml += '<circle data-key="'+key+'" data-n="'+n+'" class="donut-seg" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colorMap[key]+'" stroke-width="'+sw+'" ' +
        'stroke-dasharray="'+dash.toFixed(2)+' '+gap.toFixed(2)+'" transform="rotate('+rotation+' '+cx+' '+cy+')" stroke-linecap="butt"></circle>';
      acc += frac;
    });
    segHtml += '<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" font-family="Chakra Petch" font-weight="700" font-size="22" fill="'+cssVar("--text-primary")+'">'+total+'</text>';
    segHtml += '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-family="Sarabun" font-size="10.5" fill="'+cssVar("--text-muted")+'">ทั้งหมด</text>';
    svg.innerHTML = segHtml;

    var tooltip = document.getElementById("tooltip");
    svg.querySelectorAll(".donut-seg").forEach(function(seg){
      seg.addEventListener("mousemove", function(ev){
        var key = seg.getAttribute("data-key");
        var n = seg.getAttribute("data-n");
        var pct = Math.round(n/total*100);
        tooltip.textContent = labelMap[key] + ": " + n + " (" + pct + "%)";
        tooltip.style.left = ev.clientX + "px";
        tooltip.style.top = ev.clientY + "px";
        tooltip.classList.add("show");
      });
      seg.addEventListener("mouseleave", function(){ tooltip.classList.remove("show"); });
    });

    legendEl.innerHTML = order.map(function(key){
      var n = counts[key] || 0;
      return '<div class="legend-item"><span class="dot" style="background:'+colorMap[key]+'"></span>'+labelMap[key]+'<span class="n tabular">'+n+'</span></div>';
    }).join("");
  }

  // เมื่อเลือกแท็บ "ทั้งหมด" กราฟนี้แสดงจำนวน KPI ตามหมวดใหญ่ (เหมือนเดิม)
  // เมื่อเลือกแท็บเฉพาะส่วน กราฟนี้สลับไปแสดงภาระงานตามผู้รับผิดชอบของส่วนนั้น ซึ่งมีประโยชน์กว่าสำหรับมุมมองที่กรองแล้ว
  function renderSecondChart(list, groupCounts){
    var titleEl = document.getElementById("groupChartTitle");
    var el = document.getElementById("groupBars");

    if (activeGroupTab === "all"){
      titleEl.textContent = "จำนวน KPI ตามหมวดใหญ่";
      var total = list.length;
      var defs = [
        {key:"dept", label:GROUP_LABEL.dept, color:cssVar("--cat-1")},
        {key:"individual", label:GROUP_LABEL.individual, color:cssVar("--cat-2")},
        {key:"agenda", label:GROUP_LABEL.agenda, color:cssVar("--cat-3")}
      ];
      el.innerHTML = defs.map(function(d){
        var n = groupCounts[d.key] || 0;
        var pct = total ? Math.round(n/total*100) : 0;
        return '<div class="bar-row"><div class="bar-head"><span>'+d.label+'</span><b class="tabular">'+n+'</b></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+d.color+'"></div></div></div>';
      }).join("");
      return;
    }

    titleEl.textContent = "ภาระงานตามผู้รับผิดชอบ ("+GROUP_TAB_LABEL[activeGroupTab]+")";
    var palette = ["--cat-1","--cat-2","--cat-3","--accent","--good","--warning","--serious","--critical"];
    var counts = {};
    list.forEach(function(k){
      k.owner.split(",").forEach(function(part){
        var name = part.trim();
        if (!name) return;
        counts[name] = (counts[name]||0) + 1;
      });
    });
    var rows = Object.keys(counts).map(function(name){ return {name:name, n:counts[name]}; });
    rows.sort(function(a,b){ return b.n - a.n || a.name.localeCompare(b.name,"th"); });
    rows = rows.slice(0, 8);
    if (!rows.length){
      el.innerHTML = '<p class="empty-note" style="padding:20px 0;">ยังไม่มีผู้รับผิดชอบในส่วนนี้</p>';
      return;
    }
    var maxN = rows[0].n;
    el.innerHTML = rows.map(function(r, i){
      var pct = maxN ? Math.round(r.n/maxN*100) : 0;
      var color = cssVar(palette[i % palette.length]);
      return '<div class="bar-row"><div class="bar-head"><span>'+escapeHtml(r.name)+'</span><b class="tabular">'+r.n+'</b></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
    }).join("");
  }

  /* ================= LIST ================= */
  var GROUP_ORDER = ["dept","individual","agenda"];

  function matchesFilter(k){
    if (ownerMode === "mine" && !ownerMatchesMe(k.owner)) return false;
    if (!searchTerm) return true;
    var hay = (k.task+" "+k.owner+" "+k.kpi+" "+(k.category||"")).toLowerCase();
    return hay.indexOf(searchTerm) !== -1;
  }

  function renderList(){
    var container = document.getElementById("kpiList");
    var groupsToShow = activeGroupTab === "all" ? GROUP_ORDER : [activeGroupTab];
    var any = false;
    var html = "";
    groupsToShow.forEach(function(g){
      var items = KPI_CATALOG.filter(function(k){ return k.group === g && matchesFilter(k); });
      if (!items.length) return;
      any = true;
      html += '<section class="group-block"><div class="group-head"><h2>'+GROUP_LABEL[g]+'</h2><span class="count">'+items.length+' รายการ</span>' +
        '<button type="button" class="add-kpi-btn" data-group="'+g+'">+ เพิ่มตัวชี้วัด</button></div>';
      html += '<div class="cards">' + items.map(renderCard).join("") + '</div></section>';
    });
    if (!any && !searchTerm && ownerMode==="all"){
      // ไม่มี KPI เลยในส่วนที่เลือก (เช่น ลบออกหมด) — ให้ปุ่มเพิ่มตัวชี้วัดใหม่ในแต่ละส่วนเสมอ
      html = groupsToShow.map(function(g){
        return '<section class="group-block"><div class="group-head"><h2>'+GROUP_LABEL[g]+'</h2><span class="count">0 รายการ</span>' +
          '<button type="button" class="add-kpi-btn" data-group="'+g+'">+ เพิ่มตัวชี้วัด</button></div><p class="empty-note">ยังไม่มีตัวชี้วัดในส่วนนี้</p></section>';
      }).join("");
    } else if (!any){
      html = '<p class="empty-note">ไม่พบรายการที่ตรงกับการค้นหา</p>';
    }
    container.innerHTML = html;
    container.querySelectorAll(".kpi-card").forEach(function(card){
      card.addEventListener("click", function(){ openModal(card.getAttribute("data-id")); });
    });
    container.querySelectorAll(".add-kpi-btn").forEach(function(btn){
      btn.addEventListener("click", function(){ openKpiForm("add", btn.getAttribute("data-group"), null); });
    });
  }

  function renderCard(k){
    var latest = latestEntryForKpi(k.id);
    var st = latest ? latest.entry.status : "not_started";
    var meta = STATUS_META[st];
    var reported = reportedMonthCount(k.id);
    var pct = Math.round(reported/MONTHS.length*100);

    var targetChipClass = "target-chip";
    var targetChipText = "เป้าหมาย "+escapeHtml(k.target);
    if (k.metricType === "count" && typeof k.targetNum === "number"){
      var total = cumulativeCountFull(k.id);
      var ok = k.cmp === "lte" ? total <= k.targetNum : total >= k.targetNum;
      var over = k.cmp === "lte" && total > k.targetNum;
      targetChipClass += ok ? " good" : (over ? " critical" : "");
      targetChipText = "สะสม "+total+" / "+k.targetNum+(k.targetUnit?" "+escapeHtml(k.targetUnit):"");
    }

    // ค่าที่ทำได้จริง (สำหรับตัวชี้วัดประเภท percent/other แสดงค่าล่าสุดที่รายงาน; ประเภท count ใช้ยอดสะสมใน target-chip ด้านบนแล้ว)
    var actualLineHtml = "";
    if (k.metricType !== "count"){
      if (latest && latest.entry.actual){
        var av = latest.entry.actual;
        var cls = "actual-val";
        var aNum = parseFloat(String(av).replace(/[^0-9.\-]/g,""));
        var tNum = parseFloat(String(k.target).replace(/[^0-9.\-]/g,""));
        if (!isNaN(aNum) && !isNaN(tNum) && tNum !== 0){
          var isLte = k.cmp === "lte" || /(<=|ไม่เกิน)/.test(k.target||"");
          var vOk = isLte ? aNum <= tNum : aNum >= tNum;
          cls += vOk ? " good" : " warning";
        }
        actualLineHtml = '<div class="actual-line">ค่าที่ทำได้จริง <span class="'+cls+'">'+escapeHtml(av)+'</span>' +
          '<span class="actual-asof">('+escapeHtml(latest.month.label)+')</span></div>';
      } else if (k.kpi) {
        actualLineHtml = '<div class="actual-line muted">ยังไม่รายงานค่าที่ทำได้จริง</div>';
      }
    }

    return '<button type="button" class="kpi-card" data-id="'+k.id+'">' +
      '<div class="card-top">' +
        '<span class="no-badge">#'+k.no+'</span>' +
        (k.category ? '<span class="cat-tag">'+escapeHtml(k.category)+'</span>' : '') +
        '<span class="status-pill st-'+meta.cls+'"><span class="dot"></span>'+meta.label+'</span>' +
      '</div>' +
      '<div class="card-title">'+escapeHtml(k.task)+'</div>' +
      '<div class="card-kpi">'+escapeHtml(k.kpi || "อยู่ระหว่างกำหนดตัวชี้วัด")+'</div>' +
      '<div class="progress-line"><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
        '<span class="progress-text tabular">'+reported+'/'+MONTHS.length+' เดือน</span></div>' +
      actualLineHtml +
      '<div class="card-foot"><span class="owner-chip" title="'+escapeHtml(k.owner)+'">'+escapeHtml(k.owner)+'</span>' +
        '<span class="'+targetChipClass+'">'+targetChipText+'</span></div>' +
    '</button>';
  }

  /* ================= MODAL ================= */
  function openModal(kpiId){
    currentKpiId = kpiId;
    var k = KPI_CATALOG.filter(function(x){ return x.id===kpiId; })[0];
    if (!k) return;
    var curMonth = MONTHS.filter(function(m){ return m.key === currentMonthKey; })[0] || MONTHS[MONTHS.length-1];
    currentMonthKey = curMonth.key;
    renderModal(k);
    document.getElementById("modalOverlay").hidden = false;
    document.body.style.overflow = "hidden";
  }
  function closeModal(){
    document.getElementById("modalOverlay").hidden = true;
    document.body.style.overflow = "";
    currentKpiId = null;
  }

          '<div class="form-row-2">' +
            valueFieldHtml +
            '<div class="form-row"><label>ผู้บันทึกข้อมูล</label><input class="field-input" id="entryBy" type="text" value="'+escapeHtml(entry.updatedBy || whoAmI || "")+'" placeholder="ชื่อผู้กรอก"></div>' +
          '</div>' +
          cumInfoHtml +
          '<div class="form-row"><label>รายละเอียดกิจกรรมที่ดำเนินการ (เดือนนี้)</label><textarea class="field-textarea" id="entryDetail" placeholder="สรุปความคืบหน้า/กิจกรรมของเดือนนี้">'+escapeHtml(entry.detail||"")+'</textarea></div>' +
          '<div class="form-row"><label>Note (หมายเหตุเพิ่มเติม)</label><input class="field-input" id="entryNote" type="text" value="'+escapeHtml(entry.note||"")+'" placeholder="ข้อสังเกต ข้อยกเว้น หรือสิ่งที่ต้องติดตามต่อ"></div>' +
          '<div class="save-row"><button type="button" class="btn-primary" id="saveBtn">บันทึก</button><span class="save-meta" id="saveMeta">'+lastSavedText+'</span></div>' +
        '</div>' +
        '<div class="history"><h4>ภาพรวมทั้งปีงบประมาณ '+selectedYear+'</h4><div class="history-grid">'+historyHtml+'</div></div>' +
      '</div>';

    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    document.getElementById("modalEditBtn").addEventListener("click", function(){ openKpiForm("edit", k.group, k.id); });
    box.querySelectorAll("#qTabs button").forEach(function(b){
      b.addEventListener("click", function(){
        var q = parseInt(b.getAttribute("data-q"),10);
        var firstOfQ = MONTHS.filter(function(m){ return m.q===q; })[0];
        currentMonthKey = firstOfQ.key;
        renderModal(k);
      });
    });
    box.querySelectorAll("#monthChips .month-chip").forEach(function(b){
      b.addEventListener("click", function(){
        currentMonthKey = b.getAttribute("data-m");
        renderModal(k);
      });
    });
    document.getElementById("saveBtn").addEventListener("click", function(){ saveEntry(k); });
  }

  function saveEntry(k){
    var status = document.getElementById("entryStatus").value;
    var isCount = k.metricType === "count" && typeof k.targetNum === "number";
    var actual = "";
    var count = null;
    if (isCount){
      var countEl = document.getElementById("entryCount");
      var raw = countEl ? countEl.value.trim() : "";
      count = raw === "" ? null : Number(raw);
      if (count !== null && isNaN(count)) count = null;
    } else {
      var actualEl = document.getElementById("entryActual");
      actual = actualEl ? actualEl.value.trim() : "";
    }
    var detail = document.getElementById("entryDetail").value.trim();
    var note = document.getElementById("entryNote").value.trim();
    var by = document.getElementById("entryBy").value.trim() || whoAmI || "ไม่ระบุชื่อ";
    var payload = { kpiId:k.id, monthKey:currentMonthKey, status:status, actual:actual, count:count, detail:detail, note:note, updatedBy:by, updatedAt:new Date().toISOString() };

    var btn = document.getElementById("saveBtn");
    var metaEl = document.getElementById("saveMeta");
    if (HAS_SHEET){
      btn.disabled = true;
      btn.textContent = "กำลังบันทึก...";
      metaEl.classList.remove("ok");
      metaEl.textContent = "กำลังบันทึกลง Google Sheet...";
      var savedMonth = currentMonthKey;
      api("saveEntry", payload).then(function(saved){
        entries[entryKey(saved.kpiId, saved.monthKey)] = saved;
        renderList(); renderDashboard();
        if (currentKpiId === k.id && currentMonthKey === savedMonth) renderModal(k);
        var m2 = document.getElementById("saveMeta");
        if (m2){ m2.textContent = "บันทึกลง Google Sheet แล้ว · " + saved.updatedBy + " · " + new Date(saved.updatedAt).toLocaleString("th-TH"); m2.classList.add("ok"); }
        setSync("ok", "บันทึกลง Google Sheet แล้ว");
      }).catch(function(err){
        btn.disabled = false;
        btn.textContent = "บันทึก";
        metaEl.textContent = "บันทึกไม่สำเร็จ: " + errText(err);
        metaEl.classList.remove("ok");
      });
      return;
    }
    entries[entryKey(k.id,currentMonthKey)] = payload;
    {
      metaEl.textContent = "บันทึกแบบชั่วคราวในเบราว์เซอร์นี้เท่านั้น (ไม่ได้เชื่อมต่อฐานข้อมูลกลาง)";
      renderList(); renderDashboard();
    }
  }

  /* ================= KPI ADD / EDIT / DELETE ================= */
  function composeTarget(metricType, cmp, targetNum, targetUnit, targetText){
    if (metricType === "count"){
      var n = isNaN(targetNum) ? 0 : targetNum;
      return (cmp === "lte" ? "<= " : ">= ") + n + (targetUnit ? " " + targetUnit : "");
    }
    return targetText || "-";
  }

  function renderKpiForm(mode, group, kpiId){
    var editing = mode === "edit";
    var k = editing ? KPI_CATALOG.filter(function(x){ return x.id === kpiId; })[0] : null;
    var box = document.getElementById("modalBox");
    var metricType = k ? k.metricType : "percent";

    var groupOptsHtml = GROUP_ORDER.map(function(g){
      return '<option value="'+g+'"'+((k ? k.group : group) === g ? " selected" : "")+'>'+GROUP_LABEL[g]+'</option>';
    }).join("");
    var metricOptsHtml = ["percent","count","other"].map(function(mt){
      var label = mt === "percent" ? "ร้อยละ (%)" : (mt === "count" ? "จำนวน (นับสะสมตามปีงบประมาณ)" : "อื่นๆ / ข้อความอิสระ");
      return '<option value="'+mt+'"'+(metricType === mt ? " selected" : "")+'>'+label+'</option>';
    }).join("");

    var suggestedNo = k ? k.no : nextNoForGroup(group);
    var targetTextVal = k && k.metricType !== "count" ? k.target : "";
    var targetNumVal = k && k.metricType === "count" ? k.targetNum : "";
    var targetUnitVal = k && k.metricType === "count" ? (k.targetUnit || "") : "";
    var cmpVal = k && k.cmp === "lte" ? "lte" : "gte";

    box.innerHTML =
      '<div class="modal-head">' +
        '<div class="modal-head-text"><h3>'+(editing ? "แก้ไขตัวชี้วัด" : "เพิ่มตัวชี้วัดใหม่")+'</h3>' +
          '<div class="meta">'+GROUP_LABEL[k ? k.group : group]+'</div></div>' +
        '<button type="button" class="close-btn" id="kfCloseBtn" aria-label="ปิด">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="entry-form">' +
          '<div class="form-row-2">' +
            '<div class="form-row"><label>ส่วน/กลุ่ม</label><select class="field-select" id="kfGroup">'+groupOptsHtml+'</select></div>' +
            '<div class="form-row"><label>ลำดับที่ (No)</label><input class="field-input" id="kfNo" type="text" value="'+escapeHtml(suggestedNo)+'"></div>' +
          '</div>' +
          '<div class="form-row"><label>หมวดหมู่ (ถ้ามี)</label><input class="field-input" id="kfCategory" type="text" value="'+escapeHtml(k && k.category ? k.category : "")+'" placeholder="เช่น หมวด 3"></div>' +
          '<div class="form-row"><label>ผู้รับผิดชอบ / เจ้าของงาน</label><input class="field-input" id="kfOwner" type="text" value="'+escapeHtml(k ? k.owner : "")+'" placeholder="ชื่อผู้รับผิดชอบ"></div>' +
          '<div class="form-row"><label>ชื่องาน / ภาระงาน</label><textarea class="field-textarea" id="kfTask" placeholder="ชื่องานหรือภาระงานที่รับผิดชอบ">'+escapeHtml(k ? k.task : "")+'</textarea></div>' +
          '<div class="form-row"><label>ตัวชี้วัด (KPI) — เว้นว่างได้หากยังไม่กำหนด</label><textarea class="field-textarea" id="kfKpi" placeholder="คำอธิบายตัวชี้วัด">'+escapeHtml(k ? k.kpi : "")+'</textarea></div>' +
          '<div class="form-row"><label>ประเภทตัวชี้วัด</label><select class="field-select" id="kfMetricType">'+metricOptsHtml+'</select></div>' +
          '<div class="form-row-2" id="kfCountFields"'+(metricType==="count"?"":" hidden")+'>' +
            '<div class="form-row"><label>เป้าหมาย (จำนวน)</label><input class="field-input" id="kfTargetNum" type="number" step="1" value="'+escapeHtml(targetNumVal)+'"></div>' +
            '<div class="form-row"><label>หน่วยนับ</label><input class="field-input" id="kfTargetUnit" type="text" value="'+escapeHtml(targetUnitVal)+'" placeholder="เช่น โมดูล, ฉบับ, ครั้ง"></div>' +
          '</div>' +
          '<div class="form-row" id="kfCmpRow"'+(metricType==="count"?"":" hidden")+'>' +
            '<label>ทิศทางเป้าหมาย</label>' +
            '<div class="radio-row">' +
              '<label><input type="radio" name="kfCmp" value="gte"'+(cmpVal==="gte"?" checked":"")+'> อย่างน้อย (ยิ่งมากยิ่งดี)</label>' +
              '<label><input type="radio" name="kfCmp" value="lte"'+(cmpVal==="lte"?" checked":"")+'> ไม่เกิน (ยิ่งน้อยยิ่งดี)</label>' +
            '</div>' +
          '</div>' +
          '<div class="form-row" id="kfTargetTextRow"'+(metricType==="count"?" hidden":"")+'>' +
            '<label>เป้าหมาย</label><input class="field-input" id="kfTargetText" type="text" value="'+escapeHtml(targetTextVal)+'" placeholder="เช่น 100%, >= 85%, ตาม RTO, -"></div>' +
          '<div class="form-row"><label>รายละเอียดกิจกรรม</label><textarea class="field-textarea" id="kfNote" placeholder="รายละเอียด/ขอบเขตของกิจกรรมสำหรับตัวชี้วัดนี้">'+escapeHtml(k ? k.note : "")+'</textarea></div>' +
          '<div class="form-error" id="kfError" hidden></div>' +
          '<div class="kpi-form-foot">' +
            (editing ? '<button type="button" class="btn-danger" id="kfDeleteBtn">ลบตัวชี้วัดนี้</button>' : '<span></span>') +
            '<div class="save-row"><button type="button" class="btn-text" id="kfCancelBtn">ยกเลิก</button><button type="button" class="btn-primary" id="kfSaveBtn">'+(editing?"บันทึกการแก้ไข":"เพิ่มตัวชี้วัด")+'</button></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById("kfCloseBtn").addEventListener("click", closeModal);
    document.getElementById("kfCancelBtn").addEventListener("click", closeModal);
    document.getElementById("kfMetricType").addEventListener("change", function(e){
      var isCount = e.target.value === "count";
      document.getElementById("kfCountFields").hidden = !isCount;
      document.getElementById("kfCmpRow").hidden = !isCount;
      document.getElementById("kfTargetTextRow").hidden = isCount;
    });
    document.getElementById("kfSaveBtn").addEventListener("click", function(){ saveKpiForm(editing, kpiId); });
    if (editing){
      var delBtn = document.getElementById("kfDeleteBtn");
      var armed = false;
      delBtn.addEventListener("click", function(){
        if (!armed){
          armed = true;
          delBtn.textContent = "ยืนยันการลบตัวชี้วัดนี้?";
          delBtn.classList.add("armed");
          setTimeout(function(){
            if (armed){ armed = false; delBtn.textContent = "ลบตัวชี้วัดนี้"; delBtn.classList.remove("armed"); }
          }, 4000);
        } else {
          deleteKpi(kpiId);
        }
      });
    }
  }

  function saveKpiForm(editing, existingId){
    var errEl = document.getElementById("kfError");
    errEl.hidden = true;
    var group = document.getElementById("kfGroup").value;
    var noRaw = document.getElementById("kfNo").value.trim();
    var no = noRaw === "" ? nextNoForGroup(group) : (isNaN(Number(noRaw)) ? noRaw : Number(noRaw));
    var category = document.getElementById("kfCategory").value.trim() || null;
    var owner = document.getElementById("kfOwner").value.trim() || "ไม่ระบุ";
    var task = document.getElementById("kfTask").value.trim();
    var kpiText = document.getElementById("kfKpi").value.trim();
    var metricType = document.getElementById("kfMetricType").value;
    var note = document.getElementById("kfNote").value.trim();

    if (!task){
      errEl.textContent = "กรุณาระบุชื่องาน / ภาระงาน";
      errEl.hidden = false;
      return;
    }

    var targetNum = null, targetUnit = null, cmp = null, target;
    if (metricType === "count"){
      targetNum = Number(document.getElementById("kfTargetNum").value);
      if (isNaN(targetNum)){
        errEl.textContent = "กรุณาระบุเป้าหมายเป็นตัวเลข";
        errEl.hidden = false;
        return;
      }
      targetUnit = document.getElementById("kfTargetUnit").value.trim();
      var cmpEl = document.querySelector('input[name="kfCmp"]:checked');
      cmp = cmpEl ? cmpEl.value : "gte";
      target = composeTarget(metricType, cmp, targetNum, targetUnit, "");
    } else {
      target = document.getElementById("kfTargetText").value.trim() || "-";
    }

    var id = existingId || (HAS_SHEET ? "" : ("C" + Date.now().toString(36) + Math.floor(100 + Math.random()*900)));
    var data = {
      id: id, no: no, group: group, category: category, owner: owner, task: task, kpi: kpiText,
      target: target, metricType: metricType, targetNum: targetNum, targetUnit: targetUnit, cmp: cmp,
      note: note, deleted: false
    };

    var saveBtn = document.getElementById("kfSaveBtn");
    function applyLocallyAndClose(){
      kpiOverrides[id] = data;
      rebuildCatalog();
      renderAll();
      closeModal();
    }
    if (HAS_SHEET){
      saveBtn.disabled = true;
      saveBtn.textContent = "กำลังบันทึก...";
      api("saveKpi", data).then(function(saved){
        data = saved; id = saved.id;
        setSync("ok", "บันทึกลง Google Sheet แล้ว");
        applyLocallyAndClose();
      }).catch(function(err){
        saveBtn.disabled = false;
        saveBtn.textContent = editing ? "บันทึกการแก้ไข" : "เพิ่มตัวชี้วัด";
        errEl.textContent = "บันทึกไม่สำเร็จ: " + errText(err);
        errEl.hidden = false;
      });
    } else {
      applyLocallyAndClose();
    }
  }

  function deleteKpi(id){
    var data = {id: id, deleted: true};
    if (HAS_SHEET){
      api("deactivateKpi", id).then(function(){
        kpiOverrides[id] = data;
        rebuildCatalog();
        renderAll();
        closeModal();
        setSync("ok", "ปิดการใช้งาน KPI แล้ว (is_active = FALSE)");
      }).catch(function(err){
        var errEl = document.getElementById("kfError");
        if (errEl){ errEl.textContent = "ลบไม่สำเร็จ: " + errText(err); errEl.hidden = false; }
      });
    } else {
      kpiOverrides[id] = data;
      rebuildCatalog();
      renderAll();
      closeModal();
    }
  }

  function openKpiForm(mode, group, kpiId){
    currentKpiId = null;
    renderKpiForm(mode, group, kpiId);
    document.getElementById("modalOverlay").hidden = false;
    document.body.style.overflow = "hidden";
  }

  /* ================= WIRING ================= */
  function renderAll(){ renderDashboard(); renderList(); }

  // แท็บแยกส่วน Dashboard ทั้งหน้า: จำสถานะไว้ในเบราว์เซอร์ และรองรับลิงก์ตรงผ่าน #all #dept #individual #agenda
  function initSectionTabs(){
    var nav = document.getElementById("sectionTabs");
    try{
      var hashTab = (location.hash || "").replace("#", "");
      if (GROUP_TABS.indexOf(hashTab) !== -1){
        activeGroupTab = hashTab;
      } else {
        var stored = localStorage.getItem("kpiActiveGroupTab");
        if (stored && GROUP_TABS.indexOf(stored) !== -1) activeGroupTab = stored;
      }
    }catch(e){}
    nav.querySelectorAll("button[data-group]").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-group") === activeGroupTab);
    });
    nav.addEventListener("click", function(e){
      var btn = e.target.closest("button[data-group]");
      if (!btn) return;
      activeGroupTab = btn.getAttribute("data-group");
      nav.querySelectorAll("button[data-group]").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      try{ localStorage.setItem("kpiActiveGroupTab", activeGroupTab); }catch(e2){}
      try{
        var newHash = activeGroupTab === "all" ? "" : ("#"+activeGroupTab);
        history.replaceState(null, "", location.pathname + location.search + newHash);
      }catch(e3){}
      renderAll();
    });
  }

  function initToolbar(){
    document.getElementById("searchInput").addEventListener("input", function(e){
      searchTerm = e.target.value.trim().toLowerCase();
      renderList();
    });
    document.getElementById("ownerSeg").addEventListener("click", function(e){
      var btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      ownerMode = btn.getAttribute("data-mode");
      this.querySelectorAll("button").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      renderList();
    });
    document.getElementById("modalOverlay").addEventListener("click", function(e){
      if (e.target.id === "modalOverlay") closeModal();
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape") closeModal();
    });
  }

  // โหลดข้อมูลทั้งหมดจาก Google Sheet (kpi_master, monthly_entries, fiscal_months)
  function loadFromSheet(silent){
    if (!HAS_SHEET){
      setSync("err", "ยังไม่ได้เชื่อมต่อ Google Sheet · ข้อมูลไม่ถูกบันทึกถาวร");
      return;
    }
    if (!silent) setSync("busy", "กำลังโหลดข้อมูลจาก Google Sheet...");
    api("getAllData").then(function(data){
      KPI_DEFAULTS = data.kpis;
      kpiOverrides = {};
      rebuildCatalog();
      entries = {};
      data.entries.forEach(function(e){ entries[entryKey(e.kpiId, e.monthKey)] = e; });
      var changed = false;
      (data.fiscalYears || []).forEach(function(y){
        if (activeYears.indexOf(y) === -1){ activeYears.push(y); changed = true; }
      });
      if (changed){ activeYears.sort(function(a,b){ return a-b; }); renderYearSelect(); }
      if (!sheetLoaded){
        sheetLoaded = true;
        // รายชื่อ "คุณคือ" ต้องสร้างใหม่หลังได้รายชื่อผู้รับผิดชอบจากชีต
        var sel = document.getElementById("whoamiSelect");
        var keep = whoAmI;
        initWhoAmIOptions();
        sel.value = keep || "";
      }
      renderAll();
      var t = new Date().toLocaleTimeString("th-TH", {hour:"2-digit", minute:"2-digit"});
      setSync("ok", "เชื่อมต่อ Google Sheet · อัปเดต " + t + ' · <button type="button" id="reloadBtn">โหลดใหม่</button>');
      var rb = document.getElementById("reloadBtn");
      if (rb) rb.addEventListener("click", function(){ loadFromSheet(false); });
    }).catch(function(err){
      setSync("err", "โหลดข้อมูลไม่สำเร็จ: " + escapeHtml(errText(err)) + ' · <button type="button" id="reloadBtn">ลองใหม่</button>');
      var rb = document.getElementById("reloadBtn");
      if (rb) rb.addEventListener("click", function(){ loadFromSheet(false); });
    });
  }

  function initWhoAmIOptions(){
    var sel = document.getElementById("whoamiSelect");
    var owners = uniqueOwners();
    if (whoAmI && owners.indexOf(whoAmI) === -1) owners.push(whoAmI);
    var opts = ['<option value="">— เลือกชื่อ —</option>'];
    owners.forEach(function(o){ opts.push('<option value="'+escapeHtml(o)+'">'+escapeHtml(o)+'</option>'); });
    opts.push('<option value="__other">อื่นๆ...</option>');
    sel.innerHTML = opts.join("");
  }

  initYearUI();
  initWhoAmI();
  initSectionTabs();
  initToolbar();
  // ให้แถบค้นหาติดใต้ส่วนหัวพอดี แม้ส่วนหัวจะขึ้นสองบรรทัดบนจอแคบ
  function syncTopbarHeight(){
    var h = document.querySelector(".topbar").offsetHeight;
    document.documentElement.style.setProperty("--topbar-h", h + "px");
  }
  syncTopbarHeight();
  window.addEventListener("resize", syncTopbarHeight);
  renderAll();
  loadFromSheet(false);
  // ดึงข้อมูลล่าสุดของทีมทุก 60 วินาที (ข้ามรอบที่กำลังเปิดหน้าต่างกรอกข้อมูลอยู่ เพื่อไม่ให้สิ่งที่พิมพ์หายไป)
  if (HAS_SHEET){
    setInterval(function(){
      if (document.hidden) return;
      if (!document.getElementById("modalOverlay").hidden) return;
      loadFromSheet(true);
    }, 60000);
  }
})();
</script>
